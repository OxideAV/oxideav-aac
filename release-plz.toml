# release-plz config — https://release-plz.dev/docs/config

[workspace]
changelog_path = "./CHANGELOG.md"
allow_dirty = false

git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# Disable cargo-semver-checks: in this still-unstable workspace any
# API change is detected as a "break" and would force a 0.x → 0.y
# bump, which cascades through every dependent's version pin. Stay
# patch-only until we deliberately cut 1.0.
semver_check = false

# The round-work commit convention (`phase N (rNNN): ...`) doesn't
# match release-plz's default conventional-commits matcher, so by
# default the release-PR job decides "no releasable change" and
# returns `{"prs":[]}`. With every published 0.1.x yanked (see #1025),
# downstream consumers (oxideav-meta) can't resolve `oxideav-aac =
# "0.1"`. `release_commits = ".*"` opts every commit into the bump
# computation regardless of subject shape.
[[package]]
name = "oxideav-aac"
release_commits = ".*"
