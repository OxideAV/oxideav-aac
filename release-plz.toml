# release-plz config — https://release-plz.dev/docs/config

[workspace]
changelog_path = "./CHANGELOG.md"
allow_dirty = false

git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# Disable cargo-semver-checks: in this still-unstable workspace any
# API change is detected as a "break" and would force a 0.x → 0.y
# bump, which cascades through every dependent's version pin. Stay
# patch-only until we deliberately cut 1.0.
semver_check = false

# Recognise this crate's round-work commit convention as "Features"
# so release-plz auto-bumps when a round lands. Without this, commits
# shaped `phase N (rNNN): ...` look like unstructured prose to the
# default conventional-commits parser, no PR is opened, and downstream
# consumers (oxideav-meta) can't resolve `oxideav-aac = "0.1"`.
#
# The first three rules are the defaults release-plz applies; the
# fourth lifts the `phase` subject convention into the same group.
[changelog]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^phase\\b", group = "Features" },
    { message = ".*", group = "Other" },
]
